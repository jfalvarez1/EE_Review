<!DOCTYPE html>
<html>
<head>
    <title>Lesson Diagnostic Test</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        body { padding: 20px; background: #0d1117; color: #fff; font-family: system-ui; }
        .log { background: #1a1a2e; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
        .error { border-left: 3px solid #f87171; }
        .warn { border-left: 3px solid #fbbf24; }
        .info { border-left: 3px solid #60a5fa; }
        .success { border-left: 3px solid #34d399; }
        #test-container { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Lesson Diagnostic Test</h1>
    <div id="log-output"></div>
    <hr>
    <h2>Lesson Content:</h2>
    <div id="test-container"></div>

    <!-- Load all dependencies -->
    <script src="../assets/ad-framework.js"></script>
    <script src="../assets/widgets.js"></script>
    <script src="../assets/schematic-svg.js"></script>

    <script>
        const logOutput = document.getElementById('log-output');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = `[${type.toUpperCase()}] ${msg}`;
            logOutput.appendChild(div);
            console.log(`[${type}]`, msg);
        }

        // Override console.error to capture errors
        const origError = console.error;
        console.error = function(...args) {
            log(args.join(' '), 'error');
            origError.apply(console, args);
        };

        // Catch uncaught errors
        window.onerror = function(msg, url, line, col, error) {
            log(`${msg} at line ${line}:${col}`, 'error');
            return false;
        };

        // Check AD framework
        log('Checking AD framework...');
        if (typeof AD === 'undefined') {
            log('AD framework not loaded!', 'error');
        } else {
            log('AD framework loaded', 'success');
            log(`AD.num: ${typeof AD.num}`, 'info');
            log(`AD.genSquare: ${typeof AD.genSquare}`, 'info');
            log(`AD.drawGrid: ${typeof AD.drawGrid}`, 'info');
            log(`AD.plotWave: ${typeof AD.plotWave}`, 'info');
            log(`AD.Schematic: ${typeof AD.Schematic}`, 'info');
        }

        // Check widgets
        log('Checking widgets...');
        if (typeof SpiceNetlistWidget === 'undefined') {
            log('SpiceNetlistWidget not loaded!', 'error');
        } else {
            log('SpiceNetlistWidget loaded', 'success');
        }
        if (typeof ChecklistWidget === 'undefined') {
            log('ChecklistWidget not loaded!', 'error');
        } else {
            log('ChecklistWidget loaded', 'success');
        }
        if (typeof ExerciseWidget === 'undefined') {
            log('ExerciseWidget not loaded!', 'error');
        } else {
            log('ExerciseWidget loaded', 'success');
        }

        // Load the lesson
        log('Loading lesson module-02/lesson-04.html...');
        fetch('../lessons/module-02/lesson-04.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('test-container').innerHTML = html;
                log('Lesson HTML loaded', 'success');

                // Execute any inline scripts
                const scripts = document.getElementById('test-container').querySelectorAll('script');
                log(`Found ${scripts.length} script(s) to execute`);

                scripts.forEach((script, i) => {
                    try {
                        log(`Executing script ${i + 1}...`);
                        eval(script.textContent);
                        log(`Script ${i + 1} executed successfully`, 'success');
                    } catch (e) {
                        log(`Script ${i + 1} error: ${e.message}\nStack: ${e.stack}`, 'error');
                    }
                });

                // Check canvas states
                setTimeout(() => {
                    log('Checking canvas states...');
                    const canvases = {
                        'int-canvas': document.getElementById('int-canvas'),
                        'diff-canvas': document.getElementById('diff-canvas'),
                        'bode-canvas': document.getElementById('bode-canvas'),
                        'wavegen-canvas': document.getElementById('wavegen-canvas')
                    };

                    for (const [name, canvas] of Object.entries(canvases)) {
                        if (!canvas) {
                            log(`Canvas ${name}: NOT FOUND`, 'error');
                        } else {
                            const ctx = canvas.getContext('2d');
                            const imageData = ctx.getImageData(0, 0, 10, 10);
                            const hasContent = imageData.data.some(v => v !== 0);
                            log(`Canvas ${name}: ${canvas.width}x${canvas.height}, has content: ${hasContent}`, hasContent ? 'success' : 'warn');
                        }
                    }

                    // Check if key elements exist
                    const elements = ['int-tau', 'int-fc', 'int-gain', 'int-vout', 'wg-freq', 'wg-tri-amp'];
                    elements.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            log(`Element #${id}: "${el.textContent}"`, el.textContent === '—' ? 'warn' : 'success');
                        } else {
                            log(`Element #${id}: NOT FOUND`, 'error');
                        }
                    });
                }, 500);
            })
            .catch(e => {
                log(`Failed to load lesson: ${e.message}`, 'error');
            });
    </script>
</body>
</html>
