<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Reference - Analog Design Refresher</title>
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        /* Page-specific layout. Everything else comes from styles.css. */
        body { padding: 0; }

        .cref-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--gap-lg);
        }

        .cref-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--gap-md);
            justify-content: space-between;
            margin-bottom: var(--gap-md);
        }

        .cref-header h1 { margin: 0; font-size: 24px; }
        .cref-header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .cref-controls {
            display: flex;
            flex-wrap: wrap;
            gap: var(--gap-sm);
            align-items: center;
        }

        .cref-controls input[type="search"] {
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 8px 12px;
            font-size: 13px;
            min-width: 220px;
        }

        .cref-chip {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--muted);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .cref-chip:hover { color: var(--text); border-color: var(--accent); }
        .cref-chip.active { background: rgba(110,231,255,.14); color: var(--accent); border-color: var(--accent); }

        .cref-count { color: var(--muted); font-size: 12px; }

        .cref-cat { margin: var(--gap-xl) 0 var(--gap-md); }
        .cref-cat h2 {
            font-size: 15px;
            color: var(--accent);
            border-bottom: 1px solid var(--line);
            padding-bottom: 6px;
            margin: 0 0 var(--gap-md);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .cref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--gap-md);
        }

        .cref-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: var(--gap-md);
            display: flex;
            flex-direction: column;
            gap: var(--gap-sm);
        }

        .cref-card > header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--gap-sm);
        }
        .cref-card h3 { margin: 0; font-size: 14px; color: var(--text); }
        .cref-refdes {
            font-size: 11px;
            color: var(--muted);
            font-family: ui-monospace, Consolas, monospace;
        }

        .cref-symbol {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            background: rgba(0,0,0,.22);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: var(--gap-sm);
        }
        .cref-symbol svg { max-width: 100%; height: auto; }

        .cref-what { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.5; }

        .cref-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
        .cref-table td { padding: 3px 6px 3px 0; vertical-align: top; }
        .cref-table td:first-child { color: var(--muted); white-space: nowrap; }
        .cref-table td:last-child {
            font-family: ui-monospace, Consolas, monospace;
            color: var(--text);
        }

        .cref-eq {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11.5px;
            color: var(--accent);
            background: rgba(110,231,255,.07);
            border-left: 2px solid var(--accent);
            padding: 4px 8px;
            margin: 3px 0;
            overflow-x: auto;
        }
        .cref-eq small { display: block; color: var(--muted); font-family: inherit; }

        .cref-list { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.55; }
        .cref-list li { margin-bottom: 3px; }
        .cref-gotcha { color: var(--warn); }

        .cref-sec-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin: 6px 0 0;
        }

        details.cref-more > summary {
            cursor: pointer;
            font-size: 12px;
            color: var(--accent);
            list-style: none;
        }
        details.cref-more > summary::-webkit-details-marker { display: none; }
        details.cref-more > summary::before { content: '+ '; }
        details.cref-more[open] > summary::before { content: '\2212 '; }

        .cref-empty { color: var(--muted); padding: var(--gap-xl); text-align: center; }

        @media (max-width: 640px) {
            .cref-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="cref-page">
    <div class="cref-header">
        <div>
            <h1>Component Reference</h1>
            <p>
                Every schematic symbol this course draws, with its parameters, governing
                equations and the things that actually bite you.
                <a href="index.html">&larr; back to the course</a>
            </p>
        </div>
        <div class="cref-controls">
            <input type="search" id="cref-search" placeholder="Search symbols, e.g. mosfet, 87T, tau" autocomplete="off">
            <span class="cref-count" id="cref-count"></span>
        </div>
    </div>

    <div class="cref-controls" id="cref-filters" style="margin-bottom: var(--gap-md);"></div>

    <div id="cref-body"></div>
</div>

<script src="assets/component-models.js"></script>
<script>
(function () {
    'use strict';

    var search = document.getElementById('cref-search');
    var filters = document.getElementById('cref-filters');
    var body = document.getElementById('cref-body');
    var countEl = document.getElementById('cref-count');
    var activeCategory = 'All';

    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function paramRows(model) {
        if (!model.params.length) return '';
        var rows = model.params.map(function (p) {
            var unit = p.unit ? ' ' + p.unit : '';
            var note = p.note ? '<small style="color:var(--muted)"> - ' + esc(p.note) + '</small>' : '';
            return '<tr><td>' + esc(p.label) + '</td><td>' + esc(p.typ) + esc(unit) + note + '</td></tr>';
        }).join('');
        return '<p class="cref-sec-title">Typical values</p><table class="cref-table">' + rows + '</table>';
    }

    function equationBlocks(model) {
        if (!model.equations.length) return '';
        return '<p class="cref-sec-title">Equations</p>' + model.equations.map(function (e) {
            return '<div class="cref-eq">' + esc(e.expr) +
                   (e.note ? '<small>' + esc(e.note) + '</small>' : '') + '</div>';
        }).join('');
    }

    function studyBlocks(model) {
        var s = model.study || {};
        var out = '';
        if (s.remember && s.remember.length) {
            out += '<p class="cref-sec-title">Remember</p><ul class="cref-list">' +
                   s.remember.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
        }
        if (s.gotchas && s.gotchas.length) {
            out += '<p class="cref-sec-title">Gotchas</p><ul class="cref-list cref-gotcha">' +
                   s.gotchas.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
        }
        return out;
    }

    function card(model) {
        var svg = ComponentModels.symbolSVG(model.key, {
            width: 150, height: 110, showPins: true
        });
        var detail = paramRows(model) + equationBlocks(model) + studyBlocks(model);
        return '<div class="cref-card" data-key="' + esc(model.key) + '">' +
                 '<header><h3>' + esc(model.name) + '</h3>' +
                   (model.refdes ? '<span class="cref-refdes">' + esc(model.refdes) + '?</span>' : '') +
                 '</header>' +
                 '<div class="cref-symbol">' + svg + '</div>' +
                 '<p class="cref-what">' + esc(model.study.what || '') + '</p>' +
                 (detail ? '<details class="cref-more"><summary>Details</summary>' + detail + '</details>' : '') +
               '</div>';
    }

    function render() {
        var q = search.value.trim();
        var list = ComponentModels.search(q);
        if (activeCategory !== 'All') {
            list = list.filter(function (m) { return m.category === activeCategory; });
        }

        countEl.textContent = list.length + ' of ' + ComponentModels.count() + ' symbols';

        if (!list.length) {
            body.innerHTML = '<p class="cref-empty">No symbol matches that search.</p>';
            return;
        }

        // Group the surviving models by category, preserving catalog order.
        var groups = [];
        var index = {};
        list.forEach(function (m) {
            if (!(m.category in index)) {
                index[m.category] = groups.length;
                groups.push({ name: m.category, items: [] });
            }
            groups[index[m.category]].items.push(m);
        });

        body.innerHTML = groups.map(function (g) {
            return '<section class="cref-cat"><h2>' + esc(g.name) +
                   ' <span class="cref-count">(' + g.items.length + ')</span></h2>' +
                   '<div class="cref-grid">' + g.items.map(card).join('') + '</div></section>';
        }).join('');
    }

    // Category filter chips.
    var cats = ['All'].concat(ComponentModels.categories());
    filters.innerHTML = cats.map(function (c) {
        return '<button class="cref-chip' + (c === 'All' ? ' active' : '') +
               '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('');

    filters.addEventListener('click', function (e) {
        var btn = e.target.closest('.cref-chip');
        if (!btn) return;
        activeCategory = btn.dataset.cat;
        filters.querySelectorAll('.cref-chip').forEach(function (b) {
            b.classList.toggle('active', b === btn);
        });
        render();
    });

    search.addEventListener('input', render);
    render();
})();
</script>
</body>
</html>
