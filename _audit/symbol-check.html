<!doctype html>
<meta charset="utf-8">
<title>BJT symbol orientation check</title>
<style>
  body { background:#0b0f16; color:#dfe7f3; font:14px system-ui; padding:24px; }
  .row { display:flex; gap:36px; flex-wrap:wrap; }
  .cell { text-align:center; }
  .cell h3 { font-size:13px; font-weight:600; color:#9fb0c8; margin:0 0 8px; }
  svg { background:rgba(255,255,255,0.03); border:1px solid #223; border-radius:6px; }
</style>
<h2>BJT symbol orientation check</h2>
<p>Rendered at 3&times; so the emitter arrowhead is unambiguous.
NPN: arrow points <b>out</b> of the base. PNP: arrow points <b>in</b> toward the base.</p>
<div class="row" id="out"></div>
<script src="../assets/component-models.js"></script>
<script>
  const cases = [
    ['npn', 0,   'npn, rotate 0 (collector up)'],
    ['pnp', 0,   'pnp, rotate 0 (collector up)'],
    ['pnp', 180, 'pnp, rotate 180 (emitter up) — as used in M5-13'],
    ['npn', 180, 'npn, rotate 180 (for comparison)'],
    ['pnp', 180, 'pnp, rotate 180 + MIRROR (emitter up, base left)', true]
  ];
  document.getElementById('out').innerHTML = cases.map(([key, rot, caption, mir]) => {
    const d = ComponentModels.draw(key, { x: 0, y: 0, rotate: rot, mirror: !!mir });
    return '<div class="cell"><h3>' + caption + '</h3>' +
      '<svg width="240" height="300" viewBox="-40 -50 80 100">' + d.markup + '</svg></div>';
  }).join('');
</script>
